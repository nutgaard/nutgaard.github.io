name: Generate repository images
on:
  schedule:
    - cron: '15 2,14 * * *'
  workflow_dispatch:

jobs:
  generate:
    name: Generate repository images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bun run generate-repo-images
        env:
          # Custom token to allow reading other repos
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.VERCEL_BLOB_READ_WRITE_TOKEN }}
